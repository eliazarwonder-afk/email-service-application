# Coolify Stack Specification for ZegaMail
# https://coolify.io/docs/services
version: "3.8"

services:
  app:
    image: ghcr.io/eliazarwonder-afk/email-service-application:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://zegabytez:zegabytez_secure_pass@postgres:5432/zegabytez_mail
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${COOLIFY_FQDN:-http://localhost:3000}
      - WHMCS_BASE_URL=${WHMCS_BASE_URL:-}
      - WHMCS_API_URL=${WHMCS_API_URL:-}
      - NEXT_PUBLIC_WHMCS_BASE_URL=${NEXT_PUBLIC_WHMCS_BASE_URL:-}
      - CPANEL_CLUSTER_HOST=${CPANEL_CLUSTER_HOST:-localhost}
      - CPANEL_SMTP_PORT=${CPANEL_SMTP_PORT:-465}
      - CPANEL_HOST=${CPANEL_HOST:-}
      - CPANEL_USER=${CPANEL_USER:-}
      - CPANEL_API_TOKEN=${CPANEL_API_TOKEN:-}
      - CPANEL_DEFAULT_MAIL_PASS=${CPANEL_DEFAULT_MAIL_PASS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Business Mail}
      - WHMCS_INTERNAL_WEBHOOK_SECRET=${WHMCS_INTERNAL_WEBHOOK_SECRET:-super_secret_whmcs_webhook_token}
      - CRON_SECRET=${CRON_SECRET:-production-cron-secret-token}
      - CRYPTO_VERIFICATION_MODE=${CRYPTO_VERIFICATION_MODE:-auto_scanner}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zegabytez
      POSTGRES_PASSWORD: zegabytez_secure_pass
      POSTGRES_DB: zegabytez_mail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zegabytez -d zegabytez_mail"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
