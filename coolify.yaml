# Coolify Stack Specification for ZegaMail
# https://coolify.io/docs/services
version: "3.8"

services:
  app:
    image: ghcr.io/eliazarwonder-afk/email-service-application:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_password}@postgres:5432/${DB_NAME:-mail_db}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=${COOLIFY_FQDN:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}

      # WHMCS Billing, Products & 1-Click SSO
      - WHMCS_BASE_URL=${WHMCS_BASE_URL:-}
      - WHMCS_API_URL=${WHMCS_API_URL:-}
      - NEXT_PUBLIC_WHMCS_BASE_URL=${NEXT_PUBLIC_WHMCS_BASE_URL:-}
      - WHMCS_API_IDENTIFIER=${WHMCS_API_IDENTIFIER:-}
      - WHMCS_API_SECRET=${WHMCS_API_SECRET:-}
      - WHMCS_INTERNAL_WEBHOOK_SECRET=${WHMCS_INTERNAL_WEBHOOK_SECRET:-}
      - WHMCS_CLIENT_SSO_SECRET=${WHMCS_CLIENT_SSO_SECRET:-}

      # cPanel & WHM Server API (Live Mailbox Provisioning & DNS)
      - CPANEL_HOST=${CPANEL_HOST:-}
      - CPANEL_PORT=${CPANEL_PORT:-2087}
      - CPANEL_USER=${CPANEL_USER:-root}
      - CPANEL_API_TOKEN=${CPANEL_API_TOKEN:-}
      - CPANEL_DEFAULT_MAIL_PASS=${CPANEL_DEFAULT_MAIL_PASS:-}
      - WHM_HOST=${WHM_HOST:-}
      - WHM_PORT=${WHM_PORT:-2087}
      - WHM_USERNAME=${WHM_USERNAME:-root}
      - WHM_API_TOKEN=${WHM_API_TOKEN:-}

      # Outbound SMTP Mailer (Exim Gateway)
      - CPANEL_CLUSTER_HOST=${CPANEL_CLUSTER_HOST:-}
      - CPANEL_SMTP_PORT=${CPANEL_SMTP_PORT:-465}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Business Mail}

      # Background Cron Scanner
      - CRON_SECRET=${CRON_SECRET:-}
      - CRYPTO_VERIFICATION_MODE=${CRYPTO_VERIFICATION_MODE:-auto_scanner}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
      POSTGRES_DB: ${DB_NAME:-mail_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mail_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
