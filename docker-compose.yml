# ==============================================================================
# ZegaMail Fullstack Docker Compose for Coolify & Production
# Multi-service stack: Next.js Frontend/API + PostgreSQL 16 + Redis 7 + PgAdmin
# ==============================================================================
version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. CORE APPLICATION (Next.js 15 Web App + REST API)
  # ---------------------------------------------------------------------------
  app:
    image: ${ZEGAMAIL_IMAGE:-ghcr.io/eliazarwonder-afk/email-service-application:latest}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # Database connection using internal docker service DNS
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zegabytez}:${SERVICE_PASSWORD_POSTGRES:-zegabytez_secure_pass}@mail-postgres:5432/${POSTGRES_DB:-zegabytez_mail}
      - REDIS_URL=redis://mail-redis:6379
      
      # Coolify Magic Variable: Resolves automatically to the domain assigned in Coolify UI
      - NEXT_PUBLIC_APP_URL=${SERVICE_FQDN_APP:-http://localhost:3000}
      # WHMCS Billing, Products & SSO Integration
      - WHMCS_BASE_URL=${WHMCS_BASE_URL:-}
      - WHMCS_API_URL=${WHMCS_API_URL:-}
      - NEXT_PUBLIC_WHMCS_BASE_URL=${NEXT_PUBLIC_WHMCS_BASE_URL:-}
      - WHMCS_API_IDENTIFIER=${WHMCS_API_IDENTIFIER:-}
      - WHMCS_API_SECRET=${WHMCS_API_SECRET:-}
      - WHMCS_CLIENT_SSO_SECRET=${WHMCS_CLIENT_SSO_SECRET:-}
      
      # cPanel & WHM Server API
      - CPANEL_CLUSTER_HOST=${CPANEL_CLUSTER_HOST:-localhost}
      - CPANEL_SMTP_PORT=${CPANEL_SMTP_PORT:-465}
      - CPANEL_SMTP_SECURE=${CPANEL_SMTP_SECURE:-true}
      - CPANEL_HOST=${CPANEL_HOST:-}
      - CPANEL_PORT=${CPANEL_PORT:-2087}
      - CPANEL_USER=${CPANEL_USER:-root}
      - CPANEL_API_TOKEN=${CPANEL_API_TOKEN:-}
      - CPANEL_DEFAULT_MAIL_PASS=${CPANEL_DEFAULT_MAIL_PASS:-}
      - WHM_HOST=${WHM_HOST:-}
      - WHM_PORT=${WHM_PORT:-2087}
      - WHM_USERNAME=${WHM_USERNAME:-root}
      - WHM_API_TOKEN=${WHM_API_TOKEN:-}
      
      # Outbound SMTP Mailer
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Business Mail}
      
      # Security & Secrets
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-}
      - WHMCS_INTERNAL_WEBHOOK_SECRET=${WHMCS_INTERNAL_WEBHOOK_SECRET:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - CRYPTO_VERIFICATION_MODE=${CRYPTO_VERIFICATION_MODE:-auto_scanner}
      - CRYPTO_MIN_CONFIRMATIONS=${CRYPTO_MIN_CONFIRMATIONS:-1}
    depends_on:
      mail-postgres:
        condition: service_healthy
      mail-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    labels:
      - "coolify.managed=true"

  # ---------------------------------------------------------------------------
  # 2. DEDICATED DATABASE (PostgreSQL 16 Alpine)
  # ---------------------------------------------------------------------------
  mail-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zegabytez}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-zegabytez_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-zegabytez_mail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zegabytez} -d ${POSTGRES_DB:-zegabytez_mail}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. CACHE & QUEUE ENGINE (Redis 7 Alpine)
  # ---------------------------------------------------------------------------
  mail-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 4. DATABASE ADMIN UI (Optional PgAdmin 4)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password_local}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      mail-postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
